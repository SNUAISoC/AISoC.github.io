        label: Body Font
        type: select
        options:
          values:
          - name: manrope
            label: Manrope
          - name: newsreader
            label: Newsreader
          - name: dm-mono
            label: DM Mono
          - name: system-sans
            label: System Sans
          - name: system-serif
            label: System Serif
      - name: body_size
        label: Body Font Size (px)
        type: number
        options:
          min: 10
          max: 28
      - name: body_line_height
        label: Body Line Height
        type: number
        options:
          min: 1
          max: 2.4
      - name: content_width
        label: Maximum Content Width (px)
        type: number
        options:
          min: 760
          max: 1800
      - name: side_padding
