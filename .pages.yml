media:
  input: assets/images
  output: assets/images
  categories:
  - image
  rename: safe
settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: 'CMS: create {path}'
      update: 'CMS: update {path}'
      delete: 'CMS: delete {path}'
      rename: 'CMS: rename {oldPath} -> {newPath}'
content:
- name: content
  label: Website Content
  type: group
  items:
  - name: site
    label: Site Settings
    type: file
    path: _data/site.yml
    format: yaml
    operations:
      create: false
      rename: false
      delete: false
    fields:
    - name: lab_name
      label: Laboratory Name
      type: string
      required: true
    - name: logo
      label: Logo
      type: image
      required: true
    - name: email
      label: Contact Email
      type: string
      required: true
    - name: phone_display
      label: Phone Number
      type: string
    - name: phone_href
      label: Phone Link
      type: string
    - name: department
      label: Department
      type: string
    - name: university
      label: University
      type: string
    - name: location
      label: Location
      type: string
    - name: coordinates
      label: Coordinates
      type: string
    - name: address
      label: Address Lines
      type: string
      list: true
    - name: map_url
      label: Google Maps URL
      type: string
    - name: footer_tagline_line1
      label: Footer Tagline - Line 1
      type: string
    - name: footer_tagline_line2
      label: Footer Tagline - Line 2
      type: string
    - name: copyright
      label: Copyright Text
      type: string
  - name: design
    label: Design Settings
    type: file
    path: _data/design.yml
    format: yaml
    operations:
      create: false
      rename: false
      delete: false
    fields:
